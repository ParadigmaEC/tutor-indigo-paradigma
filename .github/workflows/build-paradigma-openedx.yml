name: Build Open edX image

on:
  push:
    branches:
      - release

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/paradigmaec/openedx-paradigma

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tutor
        run: |
          python -m pip install --upgrade pip
          pip install "tutor[full]==22.0.2"

      - name: Install custom Indigo plugin
        run: |
          pip install --no-deps .

      - name: Enable Indigo
        run: |
          tutor plugins enable indigo

      - name: Configure custom Open edX image
        run: |
          tutor config save \
            --set DOCKER_IMAGE_OPENEDX=${IMAGE_NAME}:dev

      - name: Build Open edX image
        run: |
          tutor images build openedx

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
          docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Push image
        run: |
          tutor images push openedx