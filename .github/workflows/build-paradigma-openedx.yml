name: Build Open edX image

on:
  push:
    branches:
      - release

permissions:
  contents: read
  packages: write

env:
  OPENEDX_IMAGE: ghcr.io/paradigmaec/openedx-paradigma
  IMAGE_TAG: release

jobs:
  build-openedx:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tutor
        run: |
          python -m pip install --upgrade pip
          pip install "tutor[full]==22.0.2"

      - name: Install custom Indigo plugin
        run: |
          pip install --no-deps .

      - name: Enable Indigo
        run: |
          tutor plugins enable indigo

      - name: Configure Open edX image
        run: |
          tutor config save \
            --set DOCKER_IMAGE_OPENEDX=${OPENEDX_IMAGE}:${IMAGE_TAG}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Open edX image
        run: |
          tutor images build openedx

      - name: Push Open edX image
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Open edX push attempt $attempt"

            if tutor images push openedx; then
              echo "Open edX push successful"
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Push failed. Retrying in 20 seconds..."
              sleep 20
            fi
          done

          echo "Open edX push failed after 3 attempts"
          exit 1